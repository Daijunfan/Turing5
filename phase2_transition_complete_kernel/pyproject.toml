[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "tcmk"
version = "0.1.0"
description = "Transition-Complete Morphology Kernel research implementation"
requires-python = ">=3.11"

[project.optional-dependencies]
experiments = ["numpy>=2"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
